<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" role="img" aria-labelledby="title desc">
  <title id="title">FleetPulse</title><desc id="desc">Animated project card for a real-time fleet tracking platform with vehicles moving along a map route.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070807"/><stop offset="1" stop-color="#0F130E"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.road{stroke-dasharray:5 7;animation:road 3s linear infinite}.blink{animation:blink 1.6s ease-in-out infinite}.ping{animation:ping 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes road{to{stroke-dashoffset:-120}}@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}@media(prefers-reduced-motion:reduce){.road,.blink,.ping{animation:none!important}}</style>
  </defs>
  <rect x="4" y="4" width="572" height="232" rx="12" fill="url(#bg)" stroke="#F2F3ED" stroke-opacity="0.16"/>
  <path d="M22 51H558M334 20V220" stroke="#F2F3ED" stroke-opacity="0.08"/>
  <g font-family="Consolas, SFMono-Regular, Menlo, monospace">
    <text x="24" y="32" fill="#B8FF5A" font-size="9" letter-spacing="1.7">CASE / 03</text><text x="256" y="32" text-anchor="end" fill="#5F655F" font-size="9">REAL-TIME SYSTEMS</text>
    <text x="24" y="91" fill="#F3F4EC" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="650">FleetPulse</text>
    <text x="24" y="121" fill="#A5AAA5" font-family="Segoe UI, Arial, sans-serif" font-size="13">Live fleet tracking and operations</text>
    <text x="24" y="152" fill="#636863" font-size="9">TYPESCRIPT  /  SOCKET.IO  /  MAPLIBRE  /  SQLITE</text>
    <rect x="24" y="180" width="8" height="8" rx="4" fill="#B8FF5A" class="blink"/><text x="42" y="188" fill="#C8CCC6" font-size="9" letter-spacing="1.2">WEBSOCKET · JWT ROLES</text>
  </g>
  <g transform="translate(455 128)">
    <ellipse cx="0" cy="52" rx="104" ry="22" fill="#000" opacity="0.75"/>
    <path d="M-100 0L0-50L100 0L0 50Z" fill="#0C110D" stroke="#B8FF5A" stroke-opacity="0.3"/>
    <path d="M-100 0L0 50V62L-100 12Z" fill="#141A14"/><path d="M100 0L0 50V62L100 12Z" fill="#0E120E"/>
    <path d="M-75 -12.5L25 37.5M-50 -25L50 25M-25 -37.5L75 12.5M-75 12.5L25 -37.5M-50 25L50 -25M-25 37.5L75 -12.5" stroke="#F2F3ED" stroke-opacity="0.06"/>
    <path d="M-62 4L-28-20L10-4L38-28L70-6" fill="none" stroke="#3A443A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="r1" d="M-62 4L-28-20L10-4L38-28L70-6" fill="none" stroke="#B8FF5A" stroke-opacity="0.6" stroke-width="1.5" class="road"/>
    <path d="M-40 26L-6 8L30 24L60 10" fill="none" stroke="#3A443A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="r2" d="M-40 26L-6 8L30 24L60 10" fill="none" stroke="#6CE5E8" stroke-opacity="0.6" stroke-width="1.5" class="road"/>
    <circle r="5" fill="#B8FF5A" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#r1"/></animateMotion></circle>
    <circle r="4" fill="#6CE5E8" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#r2"/></animateMotion></circle>
    <circle cx="38" cy="-28" r="6" fill="none" stroke="#B8FF5A" class="ping"/>
    <g transform="translate(38 -46)"><path d="M0-20C-8-20-14-14-14-6C-14 4 0 14 0 14S14 4 14-6C14-14 8-20 0-20Z" fill="#E9ECE4"/><circle cy="-6" r="5" fill="#0C110D"/></g>
  </g>
</svg>
