<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" role="img" aria-labelledby="title desc">
  <title id="title">STREAMAI</title><desc id="desc">Animated premium project card for a real-time multi-model AI interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070808"/><stop offset="1" stop-color="#0C1415"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#EEFFFF"/><stop offset="0.24" stop-color="#6CE5E8"/><stop offset="1" stop-color="#15383A"/></radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.dash{stroke-dasharray:5 10;animation:dash 4s linear infinite}.float{animation:float 6s ease-in-out infinite}.blink{animation:blink 1.8s ease-in-out infinite}@keyframes dash{to{stroke-dashoffset:-120}}@keyframes float{0%,100%{opacity:.72}50%{opacity:1}}@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.dash,.float,.blink{animation:none!important}}</style>
  </defs>
  <rect x="4" y="4" width="572" height="232" rx="12" fill="url(#bg)" stroke="#F2F3ED" stroke-opacity="0.16"/>
  <path d="M22 51H558M334 20V220" stroke="#F2F3ED" stroke-opacity="0.08"/>
  <g font-family="Consolas, SFMono-Regular, Menlo, monospace">
    <text x="24" y="32" fill="#6CE5E8" font-size="9" letter-spacing="1.7">CASE / 02</text><text x="256" y="32" text-anchor="end" fill="#5F655F" font-size="9">STREAMING INTERFACE</text>
    <text x="24" y="91" fill="#F3F4EC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="650">STREAMAI</text>
    <text x="24" y="121" fill="#A5AAA5" font-family="Segoe UI, Arial, sans-serif" font-size="13">Real-time multi-model conversation</text>
    <text x="24" y="152" fill="#636863" font-size="9">NEXT.JS  /  GEMINI  /  OPENROUTER  /  R3F</text>
    <rect x="24" y="180" width="8" height="8" rx="4" fill="#6CE5E8" class="blink"/><text x="42" y="188" fill="#C8CCC6" font-size="9" letter-spacing="1.2">LIVE · TOKEN STREAMING</text>
  </g>
  <g transform="translate(455 119)" class="float">
    <circle r="85" fill="#6CE5E8" opacity="0.04" filter="url(#glow)"/>
    <g fill="none" stroke="#6CE5E8"><ellipse rx="96" ry="30" stroke-opacity="0.38" class="dash"/><ellipse rx="67" ry="92" stroke-opacity="0.22" class="dash" transform="rotate(28)"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/><path d="M0-55L48-18L30 45L-30 45L-48-18Z" fill="#6CE5E8" fill-opacity="0.08" stroke="#A9FFFF" stroke-opacity="0.52"/><path d="M0-55V15L30 45M0 15L-30 45M-48-18L0 15L48-18" fill="none" stroke="#D9FFFF" stroke-opacity="0.28"/></g>
    <circle r="20" fill="url(#core)" filter="url(#glow)"/><circle cx="-6" cy="-7" r="4" fill="#FFF" opacity="0.8"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="8s" repeatCount="indefinite"/><circle cx="96" r="4" fill="#B8FF5A" filter="url(#glow)"/></g>
  </g>
