<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" role="img" aria-labelledby="title desc">
  <title id="title">DentalSense AI</title><desc id="desc">Animated project card for a transformer-based feedback intelligence platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070808"/><stop offset="1" stop-color="#0D1414"/></linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.b1,.b2,.b3{animation:lift 4.2s ease-in-out infinite}.b2{animation-delay:.5s}.b3{animation-delay:1s}.ring{stroke-dasharray:150 260;animation:spin 6s linear infinite}.blink{animation:blink 2s ease-in-out infinite}@keyframes lift{0%,100%{opacity:.6}50%{opacity:1}}@keyframes spin{to{stroke-dashoffset:-410}}@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.b1,.b2,.b3,.ring,.blink{animation:none!important}}</style>
  </defs>
  <rect x="4" y="4" width="572" height="232" rx="12" fill="url(#bg)" stroke="#F2F3ED" stroke-opacity="0.16"/>
  <path d="M22 51H558M334 20V220" stroke="#F2F3ED" stroke-opacity="0.08"/>
  <g font-family="Consolas, SFMono-Regular, Menlo, monospace">
    <text x="24" y="32" fill="#6CE5E8" font-size="9" letter-spacing="1.7">CASE / 02</text><text x="256" y="32" text-anchor="end" fill="#5F655F" font-size="9">NLP ANALYTICS</text>
    <text x="24" y="91" fill="#F3F4EC" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="650">DentalSense AI</text>
    <text x="24" y="121" fill="#A5AAA5" font-family="Segoe UI, Arial, sans-serif" font-size="13">Feedback intelligence with local inference</text>
    <text x="24" y="152" fill="#636863" font-size="9">FASTAPI  /  DISTILBERT  /  PYTORCH  /  REACT</text>
    <rect x="24" y="180" width="8" height="8" rx="4" fill="#6CE5E8" class="blink"/><text x="42" y="188" fill="#C8CCC6" font-size="9" letter-spacing="1.2">SAFEX INTERNSHIP · PYTEST</text>
  </g>
  <g transform="translate(455 150)">
    <ellipse cx="0" cy="34" rx="98" ry="22" fill="#000" opacity="0.75"/>
    <path d="M-92 14L0-32L92 14L0 60Z" fill="#0B1313" stroke="#6CE5E8" stroke-opacity="0.28"/>
    <g class="b1" transform="translate(-44 10)"><path d="M0 0L18 9V30L0 21Z" fill="#245F61"/><path d="M36 0L18 9V30L36 21Z" fill="#163C3D"/><path d="M0 0L18-9L36 0L18 9Z" fill="#7FF4F2"/></g>
    <g class="b2" transform="translate(-14 -24)"><path d="M0 0L18 9V64L0 55Z" fill="#54762C"/><path d="M36 0L18 9V64L36 55Z" fill="#2C421A"/><path d="M0 0L18-9L36 0L18 9Z" fill="#B8FF5A"/></g>
    <g class="b3" transform="translate(16 2)"><path d="M0 0L18 9V38L0 29Z" fill="#3A3F3B"/><path d="M36 0L18 9V38L36 29Z" fill="#232724"/><path d="M0 0L18-9L36 0L18 9Z" fill="#E9ECE4"/></g>
    <g transform="translate(0 -78)">
      <ellipse rx="66" ry="20" fill="none" stroke="#F2F3ED" stroke-opacity="0.1" stroke-width="6"/>
      <ellipse rx="66" ry="20" fill="none" stroke="#B8FF5A" stroke-width="6" class="ring" filter="url(#glow)"/>
    </g>
  </g>
</svg>
