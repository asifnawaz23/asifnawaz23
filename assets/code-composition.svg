      <path d="M684 305V315" stroke="#050505" stroke-opacity="0.35"/>
    </g>
    <text x="684" y="264" text-anchor="middle" fill="#F2F3ED" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">0.7%</text>
    <text x="684" y="346" text-anchor="middle" fill="#9AA09A" font-family="Consolas, monospace" font-size="10" letter-spacing="0.6">JAVA</text>
    <path d="M760 80V360" stroke="#F2F3ED" stroke-opacity="0.08"/>
    
    <g transform="translate(790 96)">
      <text fill="#5F655F" font-family="Consolas, monospace" font-size="9" letter-spacing="1.6">ORIGINAL PUBLIC REPOS</text>
      <text y="34" fill="#F2F3ED" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">15</text>
