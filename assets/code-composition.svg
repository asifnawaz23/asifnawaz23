      <path d="M564 290L534 305L534 315L564 300Z" fill="#8FB35C" fill-opacity="0.22"/>
      <path d="M534 275L564 290L534 305L504 290Z" fill="#8FB35C" fill-opacity="0.95"/>
      <path d="M534 305V315" stroke="#050505" stroke-opacity="0.35"/>
    </g>
    <text x="534" y="264" text-anchor="middle" fill="#F2F3ED" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">0.7%</text>
    <text x="534" y="346" text-anchor="middle" fill="#9AA09A" font-family="Consolas, monospace" font-size="10" letter-spacing="0.6">TSQL</text>
    <ellipse cx="684" cy="319" rx="40" ry="8" fill="#000" opacity="0.65"/>
    <g class="bar" style="animation-delay:1.12s">
      <path d="M654 290L684 305L684 315L654 300Z" fill="#3FA7AA" fill-opacity="0.42"/>
      <path d="M714 290L684 305L684 315L714 300Z" fill="#3FA7AA" fill-opacity="0.22"/>
