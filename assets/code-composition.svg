      <path d="M414 290L384 305L384 315L414 300Z" fill="#E9ECE4" fill-opacity="0.22"/>
      <path d="M384 275L414 290L384 305L354 290Z" fill="#E9ECE4" fill-opacity="0.95"/>
      <path d="M384 305V315" stroke="#050505" stroke-opacity="0.35"/>
    </g>
    <text x="384" y="264" text-anchor="middle" fill="#F2F3ED" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">3.9%</text>
    <text x="384" y="346" text-anchor="middle" fill="#9AA09A" font-family="Consolas, monospace" font-size="10" letter-spacing="0.6">PYTHON</text>
