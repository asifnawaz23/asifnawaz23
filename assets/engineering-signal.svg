<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Engineering signal dashboard</title>
  <desc id="desc">Animated dark engineering dashboard with verified project signals, a three-dimensional capability chart, delivery curve, and orbiting systems map.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070807"/><stop offset="1" stop-color="#0D100E"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#6F9E35"/><stop offset="1" stop-color="#C8FF78"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#247D80"/><stop offset="1" stop-color="#7FF4F2"/></linearGradient>
    <linearGradient id="whiteFade"><stop stop-color="#F2F3ED" stop-opacity="0.55"/><stop offset="1" stop-color="#F2F3ED" stop-opacity="0.04"/></linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#F2F3ED" stroke-opacity="0.03"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect x="8" y="8" width="1184" height="454" rx="14"/></clipPath>
    <style>
      .draw{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 4s ease-out infinite}.dash{stroke-dasharray:5 9;animation:dash 5s linear infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}.bar1{animation:bar 4s ease-in-out infinite}.bar2{animation:bar 4s .35s ease-in-out infinite}.bar3{animation:bar 4s .7s ease-in-out infinite}.bar4{animation:bar 4s 1.05s ease-in-out infinite}.float{animation:float 6s ease-in-out infinite}
      @keyframes draw{0%{stroke-dashoffset:700}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-700}}@keyframes dash{to{stroke-dashoffset:-140}}@keyframes pulse{0%,100%{opacity:.28}50%{opacity:1}}@keyframes bar{0%,100%{opacity:.58}50%{opacity:1}}@keyframes float{0%,100%{opacity:.78}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){.draw,.dash,.pulse,.bar1,.bar2,.bar3,.bar4,.float{animation:none!important}}
    </style>
  </defs>
  <rect x="8" y="8" width="1184" height="454" rx="14" fill="url(#bg)" stroke="#F2F3ED" stroke-opacity="0.16"/>
  <g clip-path="url(#frame)">
    <rect x="8" y="8" width="1184" height="454" fill="url(#grid)"/>
    <g font-family="Consolas, SFMono-Regular, Menlo, monospace">
      <text x="34" y="42" fill="#B8FF5A" font-size="11" letter-spacing="2">ENGINEERING SIGNAL / SELECTED WORK</text>
      <text x="958" y="42" fill="#676C67" font-size="10" letter-spacing="1.5">QUALITATIVE SYSTEM MAP</text>
      <path d="M34 58H1166" stroke="#F2F3ED" stroke-opacity="0.1"/>

      <g transform="translate(34 78)">
        <g><text y="12" fill="#656A65" font-size="9" letter-spacing="1.5">LIVE DEPLOYMENTS</text><text y="45" fill="#F2F3ED" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">03</text><circle cx="48" cy="36" r="3" fill="#B8FF5A" class="pulse"/></g>
        <g transform="translate(170)"><text y="12" fill="#656A65" font-size="9" letter-spacing="1.5">FLAGSHIP TESTS</text><text y="45" fill="#F2F3ED" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">89</text><text x="50" y="43" fill="#6CE5E8" font-size="9">PASSING</text></g>
        <g transform="translate(340)"><text y="12" fill="#656A65" font-size="9" letter-spacing="1.5">FEATURED SYSTEMS</text><text y="45" fill="#F2F3ED" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">04</text><text x="50" y="43" fill="#777C77" font-size="9">CURATED</text></g>
      </g>
    </g>

    <path d="M34 145H1166" stroke="#F2F3ED" stroke-opacity="0.08"/>

    <g transform="translate(48 178)">
      <text x="0" y="0" fill="#D8DAD4" font-family="Consolas, monospace" font-size="10" letter-spacing="1.5">01 / SYSTEM COVERAGE</text>
      <g transform="translate(18 54)">
        <path d="M0 144L180 52L354 140L176 232Z" fill="#0A0C0B" stroke="#F2F3ED" stroke-opacity="0.12"/>
        <path d="M0 144L176 232M45 121L221 209M90 98L266 186M135 75L311 163M180 52L354 140M176 232L354 140M132 209L310 117M88 186L266 94M44 163L222 71" stroke="#F2F3ED" stroke-opacity="0.055"/>

        <g class="bar1" transform="translate(48 129)"><path d="M0 0L32-16L64 0L32 17Z" fill="url(#whiteFade)"/><path d="M0 0L32 17V70L0 53Z" fill="#252925"/><path d="M64 0L32 17V70L64 52Z" fill="#171A18"/><text x="5" y="91" fill="#707570" font-family="Consolas, monospace" font-size="9">UI</text></g>
        <g class="bar2" transform="translate(119 96)"><path d="M0 0L32-16L64 0L32 17Z" fill="url(#cyan)" fill-opacity="0.75"/><path d="M0 0L32 17V94L0 77Z" fill="#1E5557"/><path d="M64 0L32 17V94L64 77Z" fill="#123536"/><text x="5" y="115" fill="#707570" font-family="Consolas, monospace" font-size="9">API</text></g>
        <g class="bar3" transform="translate(190 68)"><path d="M0 0L32-16L64 0L32 17Z" fill="url(#whiteFade)"/><path d="M0 0L32 17V118L0 101Z" fill="#303430"/><path d="M64 0L32 17V118L64 101Z" fill="#1A1D1B"/><text x="1" y="139" fill="#707570" font-family="Consolas, monospace" font-size="9">DATA</text></g>
        <g class="bar4" transform="translate(261 38)"><path d="M0 0L32-16L64 0L32 17Z" fill="url(#lime)"/><path d="M0 0L32 17V145L0 128Z" fill="#54762C"/><path d="M64 0L32 17V145L64 128Z" fill="#2C421A"/><text x="5" y="166" fill="#B8FF5A" font-family="Consolas, monospace" font-size="9">AI</text></g>
      </g>
    </g>

    <g transform="translate(480 178)">
      <text x="0" y="0" fill="#D8DAD4" font-family="Consolas, monospace" font-size="10" letter-spacing="1.5">02 / DELIVERY CURVE</text>
      <g transform="translate(0 36)">
        <path d="M0 204H402M0 153H402M0 102H402M0 51H402" stroke="#F2F3ED" stroke-opacity="0.055"/>
        <path d="M10 181C63 178 82 148 116 151S174 108 211 116S270 63 306 78S353 35 393 40" fill="none" stroke="#B8FF5A" stroke-width="2.5" class="draw" filter="url(#glow)"/>
        <path d="M10 181C63 178 82 148 116 151S174 108 211 116S270 63 306 78S353 35 393 40V204H10Z" fill="url(#lime)" opacity="0.055"/>
        <g fill="#0A0C0B" stroke="#B8FF5A"><circle cx="10" cy="181" r="5"/><circle cx="116" cy="151" r="5"/><circle cx="211" cy="116" r="5"/><circle cx="306" cy="78" r="5"/><circle cx="393" cy="40" r="5"/></g>
        <g fill="#676C67" font-family="Consolas, monospace" font-size="8" text-anchor="middle"><text x="10" y="225">DISCOVER</text><text x="116" y="225">ARCHITECT</text><text x="211" y="225">BUILD</text><text x="306" y="225">VALIDATE</text><text x="393" y="225">SHIP</text></g>
        <path d="M10 181L116 151L211 116L306 78L393 40" fill="none" stroke="#6CE5E8" stroke-opacity="0.24" class="dash"/>
      </g>
    </g>

    <g transform="translate(972 286)">
      <text x="-62" y="-108" fill="#D8DAD4" font-family="Consolas, monospace" font-size="10" letter-spacing="1.5">03 / SYSTEM CORE</text>
      <g class="float">
        <circle r="92" fill="none" stroke="#F2F3ED" stroke-opacity="0.09"/>
        <circle r="72" fill="none" stroke="#6CE5E8" stroke-opacity="0.34" stroke-dasharray="8 10" class="dash"/>
        <circle r="48" fill="none" stroke="#B8FF5A" stroke-opacity="0.4" stroke-dasharray="88 214" transform="rotate(-70)"/>
        <circle r="23" fill="#B8FF5A" opacity="0.08" filter="url(#glow)"/><circle r="9" fill="#B8FF5A" filter="url(#glow)"/>
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="11s" repeatCount="indefinite"/><circle cx="72" cy="0" r="5" fill="#6CE5E8"/><circle cx="-72" cy="0" r="3" fill="#F2F3ED"/></g>
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="17s" repeatCount="indefinite"/><circle cx="0" cy="-92" r="4" fill="#B8FF5A"/><circle cx="0" cy="92" r="3" fill="#6CE5E8"/></g>
      </g>
      <g fill="#666B66" font-family="Consolas, monospace" font-size="8" letter-spacing="1"><text x="-132" y="128">PRODUCT</text><text x="-24" y="128">SYSTEMS</text><text x="72" y="128">MOTION</text></g>
    </g>

  </g>
</svg>
