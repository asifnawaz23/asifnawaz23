<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" role="img" aria-labelledby="title desc">
  <title id="title">Prime App Solutions</title><desc id="desc">Animated premium project card for a full-stack agency platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080807"/><stop offset="1" stop-color="#13130E"/></linearGradient>
    <linearGradient id="top"><stop stop-color="#F0F3E9"/><stop offset="1" stop-color="#B8FF5A"/></linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.stack1{animation:rise 4.6s ease-in-out infinite}.stack2{animation:rise 4.6s .7s ease-in-out infinite}.stack3{animation:rise 4.6s 1.4s ease-in-out infinite}.flow{stroke-dasharray:7 10;animation:flow 4s linear infinite}@keyframes rise{0%,100%{opacity:.62}50%{opacity:1}}@keyframes flow{to{stroke-dashoffset:-120}}@media(prefers-reduced-motion:reduce){.stack1,.stack2,.stack3,.flow{animation:none!important}}</style>
  </defs>
  <rect x="4" y="4" width="572" height="232" rx="12" fill="url(#bg)" stroke="#F2F3ED" stroke-opacity="0.16"/>
  <path d="M22 51H558M334 20V220" stroke="#F2F3ED" stroke-opacity="0.08"/>
  <g font-family="Consolas, SFMono-Regular, Menlo, monospace">
