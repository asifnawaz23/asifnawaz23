    <text x="24" y="91" fill="#F3F4EC" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="650">Prime App</text>
    <text x="24" y="121" fill="#A5AAA5" font-family="Segoe UI, Arial, sans-serif" font-size="13">Full-stack digital agency system</text>
    <text x="24" y="152" fill="#636863" font-size="9">NEXT.JS  /  PRISMA  /  POSTGRESQL  /  3D</text>
    <rect x="24" y="180" width="8" height="8" rx="4" fill="#B8FF5A"/><text x="42" y="188" fill="#C8CCC6" font-size="9" letter-spacing="1.2">DEPLOYED · ADMIN + CMS</text>
  </g>
  <g transform="translate(455 122)">
    <ellipse cx="0" cy="76" rx="91" ry="20" fill="#000" opacity="0.75"/>
    <path d="M-88 38L0-8L88 38L0 84Z" fill="#0C0E0C" stroke="#F2F3ED" stroke-opacity="0.12"/>
    <path d="M-88 38L0 84L88 38" fill="none" stroke="#B8FF5A" stroke-opacity="0.17" class="flow"/>
    <g class="stack1" transform="translate(-45 18)"><path d="M0 0L31-16L62 0L31 16Z" fill="url(#top)" fill-opacity="0.42"/><path d="M0 0L31 16V57L0 41Z" fill="#414D36"/><path d="M62 0L31 16V57L62 41Z" fill="#22291F"/></g>
    <g class="stack2" transform="translate(18 -12)"><path d="M0 0L31-16L62 0L31 16Z" fill="url(#top)" fill-opacity="0.72"/><path d="M0 0L31 16V80L0 64Z" fill="#58713A"/><path d="M62 0L31 16V80L62 64Z" fill="#2D3D22"/></g>
    <g class="stack3" transform="translate(-17 -70)"><path d="M0 0L31-16L62 0L31 16Z" fill="#E9FFD1"/><path d="M0 0L31 16V48L0 32Z" fill="#7DAF42"/><path d="M62 0L31 16V48L62 32Z" fill="#426425"/><circle cx="31" cy="0" r="3" fill="#091006" filter="url(#glow)"/></g>
  </g>
</svg>
