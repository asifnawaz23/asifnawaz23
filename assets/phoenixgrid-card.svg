<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" role="img" aria-labelledby="title desc">
  <title id="title">PhoenixGrid</title><desc id="desc">Animated premium project card for an emergency response and spatial tracking platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080807"/><stop offset="1" stop-color="#111311"/></linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4F5EE"/><stop offset="1" stop-color="#6CE5E8"/></linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.map{animation:float 6s ease-in-out infinite}.ring{animation:ring 3s ease-out infinite;transform-origin:455px 160px}.ring2{animation:ring 3s 1.5s ease-out infinite;transform-origin:455px 160px}.route{stroke-dasharray:5 8;animation:route 4s linear infinite}@keyframes float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-5px)}}@keyframes ring{0%{transform:scale(.35);opacity:.8}100%{transform:scale(1.45);opacity:0}}@keyframes route{to{stroke-dashoffset:-120}}@media(prefers-reduced-motion:reduce){.map,.ring,.ring2,.route{animation:none!important}}</style>
  </defs>
  <rect x="4" y="4" width="572" height="232" rx="12" fill="url(#bg)" stroke="#F2F3ED" stroke-opacity="0.16"/>
  <path d="M22 51H558M334 20V220" stroke="#F2F3ED" stroke-opacity="0.08"/>
  <g font-family="Consolas, SFMono-Regular, Menlo, monospace">
    <text x="24" y="32" fill="#6CE5E8" font-size="9" letter-spacing="1.7">CASE / 04</text><text x="256" y="32" text-anchor="end" fill="#5F655F" font-size="9">SPATIAL OPERATIONS</text>
    <text x="24" y="91" fill="#F3F4EC" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="650">PhoenixGrid</text>
    <text x="24" y="121" fill="#A5AAA5" font-family="Segoe UI, Arial, sans-serif" font-size="13">Emergency response coordination</text>
    <text x="24" y="152" fill="#636863" font-size="9">REACT  /  LEAFLET  /  EXPRESS  /  MSSQL</text>
    <rect x="24" y="180" width="8" height="8" rx="4" fill="#6CE5E8"/><text x="42" y="188" fill="#C8CCC6" font-size="9" letter-spacing="1.2">INCIDENT + MAP WORKFLOWS</text>
  </g>
  <g class="map">
    <path d="M365 154L455 108L548 155L457 202Z" fill="#0C1211" stroke="#6CE5E8" stroke-opacity="0.33"/>
    <path d="M365 154L457 202M388 142L480 190M411 130L503 178M434 119L526 166M457 108L548 155M457 202L548 155M434 190L525 143M411 178L502 131M388 166L479 120" fill="none" stroke="#F2F3ED" stroke-opacity="0.08"/>
    <path d="M385 160C410 138 436 176 459 150S501 128 533 151" fill="none" stroke="#B8FF5A" stroke-opacity="0.65" class="route"/>
  </g>
  <g transform="translate(455 92)">
    <path d="M0-51C-24-51-42-33-42-10C-42 21 0 57 0 57S42 21 42-10C42-33 24-51 0-51Z" fill="url(#pin)" stroke="#E8FFFF" stroke-opacity="0.65" filter="url(#glow)"/>
    <circle cy="-11" r="15" fill="#0A1110"/><path d="M-8-11H8M0-19V-3" stroke="#B8FF5A" stroke-width="5" stroke-linecap="round"/>
  </g>
  <ellipse class="ring" cx="455" cy="160" rx="42" ry="13" fill="none" stroke="#6CE5E8"/><ellipse class="ring2" cx="455" cy="160" rx="42" ry="13" fill="none" stroke="#B8FF5A"/>
</svg>
